name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

# このworkflowはテスト実行のみでrepositoryへの書き込みを行わないため、
# GITHUB_TOKENの権限をread-onlyに絞る。zengin-pl-apiのcross-repo同期は
# この権限を使わず、zengin-pl-api側が自分自身のGITHUB_TOKENでpull型に
# 追随する(zengin-pl側からの書き込み・通知は行わない)。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ["5.42", "5.40", "5.38", "5.36"]

    name: Perl ${{ matrix.perl }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Install cpanm
        run: curl -L https://cpanmin.us | perl - App::cpanminus

      - name: Install dependencies
        run: cpanm -nq --installdeps --with-develop --with-recommends .

      - name: Run test
        run: prove -lr t
